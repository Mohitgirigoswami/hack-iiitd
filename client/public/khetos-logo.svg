<svg width="512" height="512" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="khetosBg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0d12" />
      <stop offset="1" stop-color="#131c26" />
    </linearGradient>

    <linearGradient id="khetosEmerald" x1="20" y1="100" x2="100" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669" />
      <stop offset="0.5" stop-color="#10b981" />
      <stop offset="1" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="khetosGold" x1="30" y1="30" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d97706" />
      <stop offset="0.5" stop-color="#f59e0b" />
      <stop offset="1" stop-color="#fbbf24" />
    </linearGradient>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded squircle chassis -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#khetosBg)" stroke="#1e293b" stroke-width="2.5" />
  <rect x="5" y="5" width="110" height="110" rx="25" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.25" />

  <!-- Curved Corridor Highway (Pucca Road) -->
  <path d="M24 96 C42 94 48 68 62 58 C76 48 88 52 98 26" stroke="url(#khetosEmerald)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#emeraldGlow)" />

  <!-- Highway Centerline Dashes -->
  <path d="M26 95 C43 93 49 68 62 58 C75 48 87 52 96 28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6" fill="none" opacity="0.8" />

  <!-- Golden Wheat Grains (खेत Harvest) -->
  <ellipse cx="68" cy="40" rx="7" ry="13" transform="rotate(35 68 40)" fill="url(#khetosGold)" />
  <ellipse cx="46" cy="48" rx="6" ry="12" transform="rotate(-35 46 48)" fill="url(#khetosGold)" />
  <ellipse cx="80" cy="28" rx="6" ry="11" transform="rotate(40 80 28)" fill="url(#khetosGold)" />
  <ellipse cx="54" cy="66" rx="6" ry="11" transform="rotate(-25 54 66)" fill="url(#khetosGold)" />

  <!-- Central Node -->
  <circle cx="62" cy="58" r="4.5" fill="#ffffff" />
  <circle cx="62" cy="58" r="8" stroke="#10b981" stroke-width="2" fill="none" opacity="0.6" />
</svg>
